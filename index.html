<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔬菜大挑戰 - Hanzi Fun</title>
    <style>
        :root { --primary: #4CAF50; --secondary: #8BC34A; --bg: #F1F8E9; --text: #2E7D32; --error: #E74C3C; --success: #27AE60; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #game-box { background: white; width: 95%; max-width: 650px; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; position: relative; }
        
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: var(--text); }
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #inner-bar { height: 100%; width: 0%; background: var(--primary); transition: 0.3s; }

        .phase { display: none; flex-direction: column; align-items: center; min-height: 400px; }
        .active { display: flex; }
        .word-img { width: 200px; height: 200px; object-fit: cover; border-radius: 20px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .big-char { font-size: 70px; margin: 10px 0; font-weight: bold; color: #1B5E20; }
        
        input, textarea { font-size: 20px; padding: 12px; width: 85%; border: 2px solid #C8E6C9; border-radius: 12px; outline: none; text-align: center; }
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 15px; }
        .opt-btn { padding: 15px; border: 2px solid var(--secondary); border-radius: 12px; background: white; cursor: pointer; font-size: 18px; }
        
        #feedback { margin-top: 15px; padding: 12px; border-radius: 12px; width: 85%; display: none; text-align: left; }
        .fb-success { background: #EAFAF1; color: #27AE60; border-left: 5px solid #27AE60; }
        .fb-error { background: #FDEDEC; color: #E74C3C; border-left: 5px solid #E74C3C; }

        .btn-next { background: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="game-box">
        <div id="setup" class="phase active">
            <h2>蔬菜大挑戰 🥗</h2>
            <p>老師若有 API Key 請輸入（沒有請直接點開始）：</p>
            <input type="password" id="api-key" placeholder="貼上 Gemini API Key">
            <button class="btn-next" onclick="startGame()">開始遊戲</button>
        </div>

        <div class="stats" id="stats-ui" style="display:none">
            <div id="progress-text">進度: 1 / 30</div>
            <div id="combo-text" style="color:#E67E22">連擊: 0</div>
            <div id="score-text">分數: 0</div>
        </div>
        <div class="progress-bar" id="p-bar" style="display:none"><div id="inner-bar"></div></div>

        <div id="p1" class="phase">
            <img id="img-p1" class="word-img" src="">
            <div class="big-char" id="char-p1"></div>
            <input type="text" id="typer" placeholder="輸入漢字...">
        </div>

        <div id="p2" class="phase">
            <img id="img-p2" class="word-img" src="">
            <div class="big-char" id="char-p2" style="font-size:30px"></div>
            <div id="opts" class="opt-grid"></div>
        </div>

        <div id="p3" class="phase">
            <h3>用「<span id="target-w" style="color:var(--primary)"></span>」造句：</h3>
            <textarea id="s-input" rows="2" placeholder="例如：我喜歡吃..."></textarea>
            <div id="feedback"></div>
            <button id="check-btn" class="btn-next" onclick="checkSentence()">提交檢查</button>
            <button id="next-btn" class="btn-next" style="display:none" onclick="goNext()">下一題 ➔</button>
        </div>
    </div>

    <script>
        let API_KEY = "";
        let score = 0, combo = 0, idx = 0;
        const vegetables = [
            {w:"高麗菜", m:"Cabbage", img:"https://images.unsplash.com/photo-1594282486552-05b4d80fbb9f?w=300"},
            {w:"胡蘿蔔", m:"Carrot", img:"https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=300"},
            {w:"番茄", m:"Tomato", img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},
            {w:"茄子", m:"Eggplant", img:"https://images.unsplash.com/photo-1528137884233-ad9f62804c3e?w=300"},
            {w:"南瓜", m:"Pumpkin", img:"https://images.unsplash.com/photo-1506867076891-6b83f0956550?w=300"},
            {w:"大白菜", m:"Napa Cabbage", img:"https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=300"},
            {w:"青江菜", m:"Bok choy", img:"https://images.unsplash.com/photo-1587411768638-ec71f8433fca?w=300"},
            {w:"馬鈴薯", m:"Potato", img:"https://images.unsplash.com/photo-1518977676601-b53f02bad675?w=300"},
            {w:"洋蔥", m:"Onion", img:"https://images.unsplash.com/photo-1508747703725-719777637510?w=300"},
            {w:"玉米", m:"Corn", img:"https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=300"}
            // ... (此處可擴充至 30 個)
        ];

        function startGame() {
            API_KEY = document.getElementById('api-key').value.trim();
            document.getElementById('setup').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'flex';
            document.getElementById('p-bar').style.display = 'block';
            render();
        }

        function render() {
            if(idx >= vegetables.length) { alert("恭喜完成！總分：" + score); return; }
            const item = vegetables[idx];
            document.getElementById('progress-text').innerText = `進度: ${idx+1} / ${vegetables.length}`;
            document.getElementById('inner-bar').style.width = ((idx+1)/vegetables.length*100) + "%";
            
            document.getElementById('img-p1').src = item.img;
            document.getElementById('char-p1').innerText = item.w;
            document.getElementById('typer').value = "";
            showPhase('p1');
            speak(item.w);
        }

        function showPhase(id) {
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('typer').addEventListener('input', (e) => {
            if(e.target.value.trim() === vegetables[idx].w) {
                score += 10; combo++; updateUI(); goPhase2();
            }
        });

        function goPhase2() {
            showPhase('p2');
            const item = vegetables[idx];
            document.getElementById('img-p2').src = item.img;
            document.getElementById('char-p2').innerText = item.w;
            const ob = document.getElementById('opts');
            ob.innerHTML = "";
            let choices = [item.m, "Apple", "Book", "Water"].sort(() => Math.random() - 0.5);
