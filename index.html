<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Fun Beginner - 聲道視覺強化版</title>
    <style>
        :root { --primary: #FF9F1C; --secondary: #2EC4B6; --bg: #F0F9F8; --text: #2F3E46; --error: #E74C3C; --success: #27AE60; }
        body { font-family: 'PingFang TC', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-box { background: white; width: 90%; max-width: 650px; padding: 30px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; position: relative; }
        
        /* 階段樣式 */
        .phase { display: none; flex-direction: column; align-items: center; min-height: 420px; justify-content: center; }
        .active { display: flex; }
        .word-img { width: 180px; height: 180px; object-fit: cover; border-radius: 20px; margin-bottom: 15px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .big-char { font-size: 80px; margin: 10px 0; font-weight: bold; }
        
        input, textarea { font-size: 20px; padding: 15px; width: 85%; border: 2px solid #ddd; border-radius: 12px; outline: none; transition: 0.3s; }
        .opt-btn { padding: 15px; border: 2px solid var(--secondary); border-radius: 12px; background: white; cursor: pointer; font-size: 18px; margin: 5px; width: 100%; transition: 0.2s; }
        .opt-btn:hover { background: var(--secondary); color: white; }

        /* 通知提示框 (Toast) */
        #toast {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 30px; border-radius: 50px; color: white; font-weight: bold;
            opacity: 0; transition: 0.5s; z-index: 100; pointer-events: none;
        }
        .toast-success { background-color: var(--success); opacity: 1 !important; }
        .toast-error { background-color: var(--error); opacity: 1 !important; }

        #feedback-area { margin-top: 15px; padding: 15px; border-radius: 12px; width: 85%; font-size: 18px; display: none; text-align: left; }
        .feedback-error { background: #FDEDEC; border-left: 5px solid var(--error); color: var(--error); }
        .feedback-success { background: #EAFAF1; border-left: 5px solid var(--success); color: var(--success); }

        .btn-main { background: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

    <div id="toast">提示訊息</div>
    <canvas id="canvas"></canvas>

    <div id="game-box">
        <div class="phase active" id="p1">
            <img id="img-p1" class="word-img" src="">
            <div class="big-char" id="char-p1"></div>
            <p>請輸入正確漢字</p>
            <input type="text" id="typer" placeholder="輸入..." autocomplete="off">
        </div>

        <div class="phase" id="p2">
            <img id="img-p2" class="word-img" src="">
            <div class="big-char" id="char-p2" style="font-size:40px"></div>
            <p>這個詞是什麼意思？</p>
            <div id="opts" style="width:100%"></div>
        </div>

        <div class="phase" id="p3">
            <h3>造句練習</h3>
            <p>請使用「<span id="target-word" style="color:var(--primary)"></span>」造句：</p>
            <textarea id="sentence-input" rows="3"></textarea>
            <div id="feedback-area"></div>
            <button id="check-btn" class="btn-main" onclick="analyzeSentence()">提交檢查</button>
            <button id="next-btn" class="btn-main" style="display:none" onclick="nextWord()">下一題 ➔</button>
        </div>
    </div>

    <script>
        const db = [
            {
                w: "漂亮", m: "Beautiful", img: "https://images.unsplash.com/photo-1518893063132-36e46dbe2428?w=400",
                traps: [{ key: "是漂亮", suggestion: "形容詞前通常用『很』，不常用『是』。" }],
                correct: "我的老師很漂亮。"
            },
            {
                w: "咖啡", m: "Coffee", img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400",
                traps: [{ key: "吃咖啡", suggestion: "咖啡是液體，要用『喝』咖啡。" }],
                correct: "我喜歡喝熱咖啡。"
            }
        ];

        let idx = 0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 產生電子音效 (不需要外部檔案)
        function playSound(isCorrect) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // 顯示通知
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = type === 'success' ? 'toast-success' : 'toast-error';
            setTimeout(() => { t.className = ''; }, 1500);
        }

        function render() {
            if(idx >= db.length) { alert("練習結束！"); location.reload(); return; }
            const item = db[idx];
            document.getElementById('img-p1').src = item.img;
            document.getElementById('char-p1').innerText = item.w;
            document.getElementById('typer').value = "";
            showPhase('p1');
            speak(item.w);
            setTimeout(() => document.getElementById('typer').focus(), 100);
        }

        function showPhase(id) {
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('typer').addEventListener('input', (e) => {
            if(e.target.value.trim() === db[idx].w) {
                playSound(true);
                showToast("正確！", "success");
                setTimeout(goPhase2, 600);
            }
        });

        function goPhase2() {
            showPhase('p2');
            const item = db[idx];
            document.getElementById('img-p2').src = item.img;
            document.getElementById('char-p2').innerText = item.w;
            const ob = document.getElementById('opts');
            ob.innerHTML = "";
            [item.m, "Apple", "Book"].sort(()=>Math.random()-0.5).forEach(c => {
                const b = document.createElement('button');
                b.className='opt-btn'; b.innerText=c;
                b.onclick=()=>{ 
                    if(c===item.m) {
                        playSound(true);
                        showToast("選對了！", "success");
                        goPhase3();
                    } else {
                        playSound(false);
                        showToast("不對喔，再想想", "error");
                    }
                };
                ob.appendChild(b);
            });
        }

        function goPhase3() {
            showPhase('p3');
            document.getElementById('target-word').innerText = db[idx].w;
            document.getElementById('sentence-input').value = "";
            document.getElementById('feedback-area').style.display = "none";
            document.getElementById('check-btn').style.display = "inline-block";
            document.getElementById('next-btn').style.display = "none";
        }

        function analyzeSentence() {
            const input = document.getElementById('sentence-input').value.trim();
            const item = db[idx];
            const fb = document.getElementById('feedback-area');
            fb.style.display = "block";

            if(!input.includes(item.w)) {
                playSound(false);
                showToast("漏掉生詞了", "error");
                fb.className = "feedback-error";
                fb.innerText = `句子裡要包含「${item.w}」。`;
                return;
            }

            let trap = item.traps.find(t => input.includes(t.key));
            if(trap) {
                playSound(false);
                showToast("要注意語法喔", "error");
                fb.className = "feedback-error";
                fb.innerText = trap.suggestion;
                return;
            }

            // 成功
            playSound(true);
            showToast("太棒了！", "success");
            fb.className = "feedback-success";
            fb.innerHTML = `✅ 語法正確！<br>範例：${item.correct}`;
            document.getElementById('check-btn').style.display = "none";
            document.getElementById('next-btn').style.display = "inline-block";
            speak(input);
        }

        function nextWord() { idx++; render(); }
        function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'zh-TW'; window.speechSynthesis.speak(m); }
        window.onload = render;
    </script>
</body>
</html>
