<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Fun: 蔬菜大挑戰</title>
    <style>
        :root { --primary: #4CAF50; --secondary: #8BC34A; --bg: #F1F8E9; --text: #2E7D32; --error: #E74C3C; --gold: #FFD700; }
        body { font-family: 'PingFang TC', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-box { background: white; width: 95%; max-width: 700px; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; position: relative; }
        
        /* 頂部資訊欄 */
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; color: var(--text); font-size: 1.1rem; }
        .score-box { color: #2E7D32; background: #DCEDC8; padding: 5px 15px; border-radius: 20px; }
        .combo-box { color: #E67E22; min-width: 80px; }

        .progress-wrapper { width: 100%; background: #eee; height: 10px; border-radius: 5px; margin-bottom: 20px; }
        #bar { height: 100%; width: 0%; background: var(--primary); border-radius: 5px; transition: 0.4s; }

        .phase { display: none; flex-direction: column; align-items: center; min-height: 400px; justify-content: center; }
        .active { display: flex; }
        .word-img { width: 200px; height: 200px; object-fit: cover; border-radius: 20px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .big-char { font-size: 75px; margin: 10px 0; font-weight: bold; color: #1B5E20; }
        
        input, textarea { font-size: 22px; padding: 12px; width: 85%; border: 3px solid #C8E6C9; border-radius: 15px; text-align: center; outline: none; }
        input:focus { border-color: var(--primary); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .opt-btn { padding: 15px; border: 2px solid var(--secondary); border-radius: 12px; background: white; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .opt-btn:hover { background: var(--secondary); color: white; }

        /* 通知與回饋 */
        #toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 10px 25px; border-radius: 50px; color: white; opacity: 0; transition: 0.3s; z-index: 100; font-weight: bold; }
        .toast-show { opacity: 1 !important; top: 25px !important; }

        #feedback-area { margin-top: 15px; padding: 12px; border-radius: 12px; width: 85%; font-size: 18px; display: none; }
        .feedback-error { background: #FDEDEC; border-left: 5px solid var(--error); color: var(--error); }
        .feedback-success { background: #EAFAF1; border-left: 5px solid #27AE60; color: #27AE60; }

        .btn-main { background: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; margin-top: 15px; }
        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

    <div id="toast">訊息提示</div>
    <canvas id="canvas"></canvas>

    <div id="game-box">
        <div class="stats-bar">
            <div>進度：<span id="cur-idx">1</span> / 30</div>
            <div class="combo-box" id="combo-ui">連擊: 0</div>
            <div class="score-box">分數: <span id="score-ui">0</span></div>
        </div>
        <div class="progress-wrapper"><div id="bar"></div></div>

        <div class="phase active" id="p1">
            <img id="img-p1" class="word-img" src="">
            <div class="big-char" id="char-p1"></div>
            <p>請輸入這個蔬菜的名字</p>
            <input type="text" id="typer" placeholder="輸入漢字..." autocomplete="off">
        </div>

        <div class="phase" id="p2">
            <img id="img-p2" class="word-img" src="">
            <div class="big-char" id="char-p2" style="font-size:40px"></div>
            <p>它的意義是？</p>
            <div id="opts" class="options-grid"></div>
        </div>

        <div class="phase" id="p3">
            <h3>造句複習</h3>
            <p>請用「<span id="target-word" style="color:var(--primary)"></span>」造句：</p>
            <textarea id="sentence-input" rows="2" placeholder="例：我喜歡吃..."></textarea>
            <div id="feedback-area"></div>
            <button id="check-btn" class="btn-main" onclick="analyzeSentence()">提交檢查</button>
            <button id="next-btn" class="btn-main" style="display:none" onclick="nextWord()">下一題 ➔</button>
        </div>
    </div>

    <script>
        const vegetables = [
            {w:"高麗菜", m:"Cabbage", img:"https://images.unsplash.com/photo-1594282486552-05b4d80fbb9f?w=300", s:"我媽媽今天買了一顆高麗菜。"},
            {w:"青江菜", m:"Bok choy", img:"https://images.unsplash.com/photo-1587411768638-ec71f8433fca?w=300", s:"青江菜炒蒜頭很好吃。"},
            {w:"胡蘿蔔", m:"Carrot", img:"https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=300", s:"胡蘿蔔對眼睛很有幫助。"},
            {w:"花椰菜", m:"Broccoli", img:"https://images.unsplash.com/photo-1453227588063-bb302b62f50b?w=300", s:"花椰菜有很多維他命。"},
            {w:"大白菜", m:"Napa Cabbage", img:"https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=300", s:"韓國人用大白菜做泡菜。"},
            {w:"番茄", m:"Tomato", img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300", s:"番茄既是水果也是蔬菜。"},
            {w:"黃瓜", m:"Cucumber", img:"https://images.unsplash.com/photo-1449300079323-02e209d9d02e?w=300", s:"夏天吃涼拌黃瓜很舒服。"},
            {w:"茄子", m:"Eggplant", img:"https://images.unsplash.com/photo-1528137884233-ad9f62804c3e?w=300", s:"我不喜歡吃紫色的茄子。"},
            {w:"馬鈴薯", m:"Potato", img:"https://images.unsplash.com/photo-1518977676601-b53f02bad675?w=300", s:"炸薯條是用馬鈴薯做的。"},
            {w:"洋蔥", m:"Onion", img:"https://images.unsplash.com/photo-1508747703725-719777637510?w=300", s:"切洋蔥的時候會流眼淚。"},
            {w:"南瓜", m:"Pumpkin", img:"https://images.unsplash.com/photo-1506867076891-6b83f0956550?w=300", s:"萬聖節大家會刻南瓜。"},
            {w:"玉米", m:"Corn", img:"https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=300", s:"夜市的烤玉米很香。"},
            {w:"辣椒", m:"Chili", img:"https://images.unsplash.com/photo-1518991043280-1da61d9f3ac5?w=300", s:"這道菜放了很多辣椒。"},
            {w:"菠菜", m:"Spinach", img:"https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=300", s:"多吃菠菜會變得很有力氣。"},
            {w:"蘑菇", m:"Mushroom", img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300", s:"蘑菇濃湯味道很香。"},
            {w:"四季豆", m:"Green bean", img:"https://images.unsplash.com/photo-1567375638346-e2b43529b91f?w=300", s:"四季豆需要煮熟才能吃。"},
            {w:"白蘿蔔", m:"Daikon", img:"https://images.unsplash.com/photo-1582515073490-39981397c445?w=300", s:"冬天喝白蘿蔔湯很暖。"},
            {w:"苦瓜", m:"Bitter melon", img:"https://images.unsplash.com/photo-1620050854261-75817d983422?w=300", s:"苦瓜雖然很苦，但對身體好。"},
            {w:"大蒜", m:"Garlic", img:"https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?w=300", s:"炒菜的時候通常會加大蒜。"},
            {w:"薑", m:"Ginger", img:"https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=300", s:"淋雨後喝杯薑茶可以防感冒。"},
            {w:"芹菜", m:"Celery", img:"https://images.unsplash.com/photo-1610398041406-69452295092a?w=300", s:"芹菜的口感脆脆的。"},
            {w:"蘆筍", m:"Asparagus", img:"https://images.unsplash.com/photo-1515471209610-dae1c9a581c5?w=300", s:"新鮮的蘆筍非常甜。"},
            {w:"豌豆", m:"Pea", img:"https://images.unsplash.com/photo-1587334274328-64186a80aeee?w=300", s:"我不喜歡吃豌豆。"},
            {w:"韭菜", m:"Chives", img:"https://images.unsplash.com/photo-1621538350694-a400cc3f1e94?w=300", s:"韭菜盒子是非常有名的點心。"},
            {w:"地瓜", m:"Sweet potato", img:"https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=300", s:"烤地瓜是很棒的點心。"},
            {w:"芋頭", m:"Taro", img:"https://images.unsplash.com/photo-1591854238191-edabf944d716?w=300", s:"芋頭可以用來做甜點。"},
            {w:"蓮藕", m:"Lotus root", img:"https://images.unsplash.com/photo-1596547609652-9cf5d8d76921?w=300", s:"蓮藕切開後有很多小洞。"},
            {w:"秋葵", m:"Okra", img:"https://images.unsplash.com/photo-1563293750-2c21458a17d4?w=300", s:"秋葵切開像小星星。"},
            {w:"豆芽", m:"Bean sprout", img:"https://images.unsplash.com/photo-1621538350616-a19379650694?w=300", s:"豆芽便宜又營養。"},
            {w:"萵苣", m:"Lettuce", img:"https://images.unsplash.com/photo-1622206141843-23c279c2792d?w=300", s:"吃漢堡通常會放萵苣。"}
        ];

        let idx = 0, score = 0, combo = 0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function start() {
            render();
        }

        function updateStats(type) {
            if(type === 'correct') {
                score += 10;
                combo++;
                if(combo === 3) {
                    score += 20;
                    showToast("🌟 連擊獎勵 +20!", "success");
                }
                playSound(true);
            } else if(type === 'wrong') {
                score = Math.max(0, score - 5);
                combo = 0;
                playSound(false);
            }
            document.getElementById('score-ui').innerText = score;
            document.getElementById('combo-ui').innerText = `連擊: ${combo}`;
        }

        function playSound(isCorrect) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(isCorrect) {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            }
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = type === 'success' ? 'toast-show' : 'toast-show';
            t.style.backgroundColor = type === 'success' ? '#27AE60' : '#E74C3C';
            setTimeout(() => t.className = '', 1500);
        }

        function render() {
            if(idx >= vegetables.length) { alert(`挑戰結束！總分：${score}`); return; }
            const item = vegetables[idx];
            document.getElementById('cur-idx').innerText = idx + 1;
            document.getElementById('bar').style.width = ((idx+1)/30*100) + '%';
            document.getElementById('img-p1').src = item.img;
            document.getElementById('char-p1').innerText = item.w;
            document.getElementById('typer').value = "";
            showPhase('p1');
            setTimeout(() => document
